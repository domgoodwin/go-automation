<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Requestarr</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0f0f0f; color: #e0e0e0; min-height: 100vh; }

    /* ── Top nav ── */
    header { background: #1a1a2e; border-bottom: 1px solid #2a2a4a; padding: 0 1rem; display: flex; justify-content: space-between; align-items: center; }
    nav { display: flex; gap: 0; }
    .nav-tab {
      padding: 1.1rem 1.25rem; cursor: pointer; border: none; background: none;
      color: #888; font-size: 0.9rem; border-bottom: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s;
    }
    .nav-tab:hover { color: #ccc; }
    .nav-tab.active { color: #7c8cff; border-bottom-color: #7c8cff; }

    /* ── Pages ── */
    .page { display: none; max-width: 920px; margin: 2rem auto; padding: 0 1rem; }
    .page.active { display: block; }

    /* ── Search sub-tabs ── */
    .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
    .tab {
      padding: 0.45rem 1.1rem; border-radius: 6px; cursor: pointer;
      border: 1px solid #333; background: #1c1c1c; color: #888;
      font-size: 0.85rem; transition: all 0.15s;
    }
    .tab.active { background: #7c8cff; color: #fff; border-color: #7c8cff; }
    .tab.anime.active { background: #bf6fbf; border-color: #bf6fbf; }
    .tab.book.active  { background: #6fbf6f; border-color: #6fbf6f; }

    /* ── Search bar ── */
    .search-bar { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
    .search-bar input {
      flex: 1; padding: 0.75rem 1rem; border-radius: 8px;
      border: 1px solid #333; background: #1c1c1c; color: #e0e0e0;
      font-size: 1rem; outline: none;
    }
    .search-bar input:focus { border-color: #7c8cff; }

    #results { display: flex; flex-direction: column; gap: 1rem; }

    /* ── Result cards ── */
    .result-card {
      display: flex; gap: 1rem; background: #1c1c1c;
      border-radius: 10px; overflow: hidden; border: 1px solid #2a2a2a;
    }
    .result-card img {
      width: 80px; height: 120px; object-fit: cover; flex-shrink: 0;
      background: #2a2a2a;
    }
    .result-card .info { padding: 0.75rem; flex: 1; min-width: 0; }
    .result-card .title { font-weight: 600; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .result-card .year { color: #888; font-size: 0.8rem; margin: 0.2rem 0 0.5rem; }
    .result-card .overview {
      color: #aaa; font-size: 0.8rem; line-height: 1.4;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }
    .result-card .actions {
      padding: 0.75rem 0.75rem 0.75rem 0; display: flex;
      flex-direction: column; align-items: flex-end; justify-content: center; gap: 0.4rem;
    }

    button.request-btn {
      padding: 0.5rem 1rem; border-radius: 6px; border: none;
      background: #7c8cff; color: #fff; font-size: 0.85rem;
      cursor: pointer; white-space: nowrap; transition: background 0.15s;
    }
    button.request-btn:hover { background: #5a6fd6; }
    button.request-btn:disabled { background: #444; cursor: default; }
    .anime-btn { background: #bf6fbf; }
    .anime-btn:hover { background: #9a4f9a; }
    .book-btn { background: #6fbf6f; }
    .book-btn:hover { background: #4f9a4f; }

    .badge { padding: 0.4rem 0.8rem; border-radius: 6px; font-size: 0.8rem; font-weight: 600; white-space: nowrap; }
    .badge.already  { background: #2a3a2a; color: #6fbf6f; }
    .badge.ondisk   { background: #3a2a1a; color: #c8903a; }
    .badge.added    { background: #2a2a4a; color: #7c8cff; }
    .badge.searching { background: #1a2a3a; color: #5bc8e8; }
    .badge.monitored { background: #2a2a1a; color: #c8c85b; }

    a.plex-link { font-size: 0.75rem; color: #e5a00d; text-decoration: none; white-space: nowrap; }
    a.plex-link:hover { text-decoration: underline; }

    .loading { color: #888; font-size: 0.9rem; padding: 1rem 0; }
    .empty   { color: #666; font-size: 0.9rem; padding: 1rem 0; }

    /* ── Downloads ── */
    .section-title { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #666; margin-bottom: 0.75rem; }
    .torrent-card { display: flex; align-items: center; gap: 1rem; background: #1c1c1c; border-radius: 8px; padding: 0.75rem 1rem; border: 1px solid #2a2a2a; margin-bottom: 0.5rem; }
    .torrent-card.done { opacity: 0.7; }
    .torrent-info { flex: 1; min-width: 0; }
    .torrent-name { font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .torrent-meta { font-size: 0.75rem; color: #888; margin-top: 0.2rem; }
    .torrent-progress { display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0; }
    .progress-bar { width: 100px; height: 6px; background: #333; border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; background: #7c8cff; border-radius: 3px; transition: width 0.3s; }
    .progress-pct { font-size: 0.75rem; color: #888; width: 2.5rem; text-align: right; }

    /* ── Calendar ── */
    .cal-list { display: flex; flex-direction: column; gap: 1rem; }
    .cal-list-day { background: #1c1c1c; border-radius: 8px; padding: 0.75rem; border: 1px solid #2a2a2a; }
    .cal-label { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: #666; margin-bottom: 0.6rem; }
    .cal-date { color: #444; font-weight: 400; margin-left: 0.4rem; }
    .cal-entry { margin-bottom: 0.4rem; padding: 0.4rem 0.6rem; border-radius: 4px; border-left: 3px solid; }
    .cal-entry:last-child { margin-bottom: 0; }
    .cal-tv    { background: #1a1a2e; border-color: #7c8cff; }
    .cal-movie { background: #2a1a1a; border-color: #bf6f6f; }
    .cal-title { display: block; font-size: 0.85rem; font-weight: 600; }
    .cal-sub   { display: block; font-size: 0.75rem; color: #888; margin-top: 0.15rem; }

    /* ── Settings ── */
    .settings-form { max-width: 560px; }
    .setting-row { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.25rem; }
    .setting-label { font-size: 0.85rem; color: #888; width: 120px; flex-shrink: 0; }
    .setting-value { font-size: 0.85rem; color: #ccc; }
  </style>
</head>
<body>
  <header>
    <nav>
      <button class="nav-tab active" onclick="showPage('search', this)">Search</button>
      <button class="nav-tab" onclick="showPage('downloads', this)">Downloads</button>
      <button class="nav-tab" onclick="showPage('calendar', this)">Calendar</button>
      <button class="nav-tab" onclick="showPage('settings', this)">Settings</button>
    </nav>
  </header>

  <!-- ── Search page ── -->
  <div id="page-search" class="page active">
    <div class="tabs">
      <button class="tab active" id="tab-tv"    onclick="setType('tv')">TV Shows</button>
      <button class="tab"        id="tab-movie" onclick="setType('movie')">Movies</button>
      <button class="tab anime"  id="tab-anime" onclick="setType('anime')">Anime</button>
      {{if .BooksEnabled}}<button class="tab book" id="tab-book" onclick="setType('book')">Books</button>{{end}}
    </div>
    <div class="search-bar">
      <input
        type="text"
        id="search-input"
        placeholder="Search..."
        hx-get="/search"
        hx-trigger="input changed delay:400ms, search"
        hx-target="#results"
        hx-include="#media-type"
        hx-indicator="#spinner"
        name="q"
        autofocus
      />
    </div>
    <input type="hidden" id="media-type" name="type" value="tv" />
    <span id="spinner" class="loading htmx-indicator" style="display:none">Searching...</span>
    <div id="results"></div>
  </div>

  <!-- ── Downloads page ── -->
  <div id="page-downloads" class="page">
    <div id="downloads-content"
      hx-get="/downloads"
      hx-trigger="revealed, every 30s"
    ></div>
  </div>

  <!-- ── Calendar page ── -->
  <div id="page-calendar" class="page">
    <div id="calendar-content"
      hx-get="/calendar"
      hx-trigger="revealed"
    ></div>
  </div>

  <!-- ── Settings page ── -->
  <div id="page-settings" class="page">
    <div id="settings-content"
      hx-get="/settings"
      hx-trigger="revealed"
    ></div>
  </div>

  <script>
    function showPage(name, btn) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
      document.getElementById('page-' + name).classList.add('active');
      btn.classList.add('active');
    }

    function setType(type) {
      document.getElementById('media-type').value = type;
      ['tv', 'movie', 'anime', 'book'].forEach(t => {
        const el = document.getElementById('tab-' + t);
        if (el) el.classList.toggle('active', t === type);
      });
      const input = document.getElementById('search-input');
      if (input.value.trim()) htmx.trigger(input, 'search');
    }

    function sendToKindle(id, btn) {
      btn.disabled = true;
      btn.textContent = 'Sending...';
      fetch('/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id }),
      })
      .then(r => r.text())
      .then(html => { btn.parentElement.innerHTML = html; })
      .catch(() => { btn.textContent = 'Error'; btn.disabled = false; });
    }

    function requestItem(id, type, btn) {
      btn.disabled = true;
      btn.textContent = 'Requesting...';
      fetch('/request', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, type }),
      })
      .then(r => r.text())
      .then(html => { btn.parentElement.innerHTML = html; })
      .catch(() => { btn.textContent = 'Error'; });
    }
  </script>
</body>
</html>
